name: Orders API CI/CD

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 1356b3e0-7014-4c8d-bbf5-4f2e966701d4
  AZURE_TENANT_ID: d9b5111a-9ba2-417d-bede-5edee1c90dcf
  AZURE_SUBSCRIPTION_ID: b839c16f-222a-4dff-8e63-4d5aadc58449

  ACR_NAME: acrordersdev001
  IMAGE_NAME: enterprise-orders-api

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r tests/requirements.txt

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker image
        run: docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} -f docker/Dockerfile .

      - name: Push Docker image
        run: docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update Kubernetes manifest
        run: |
         sed -i "s|image: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:.*|image: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}|" kubernetes/orders-api.yaml
      - name: Commit updated Kubernetes manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/orders-api.yaml
          git commit -m "Update Orders API image to ${{ github.sha }}"
          git push

      

